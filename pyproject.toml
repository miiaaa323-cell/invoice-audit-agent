[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-audit-agent"
version = "0.1.0"
description = "Deterministic three-way invoice auditing with persistent human review"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.49,<1", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "pydantic>=2.10,<3", "PyYAML>=6,<7", "python-dotenv>=1,<2",
  "pdfplumber>=0.11,<1", "reportlab>=4,<5", "python-multipart>=0.0.20,<1",
  "jinja2>=3.1,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*", "data*", "eval*"]

[tool.setuptools.package-data]
app = ["services/prompts/*.md", "api/templates/*.html", "api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
