name: Test and replay evaluation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      LLM_MODE: replay
      ANTHROPIC_API_KEY: ""
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Lint
        run: python -m ruff check app data eval tests
      - name: Unit and workflow tests
        run: python -m pytest -q
      - name: Evaluate all 200 invoices without an API key
        run: python -m eval.run_eval --mode replay
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-evaluation
          path: eval/report.md
          if-no-files-found: ignore
